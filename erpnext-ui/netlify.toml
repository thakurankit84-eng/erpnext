[build]
  command = "npm run build"
  publish = "dist"

# Replace YOUR-ERPNEXT-SITE.example.com with your ERPNext URL.
# status = 200 makes Netlify proxy the request, so the browser stays on one origin.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-ERPNEXT-SITE.example.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/files/*"
  to = "https://YOUR-ERPNEXT-SITE.example.com/files/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/private/files/*"
  to = "https://YOUR-ERPNEXT-SITE.example.com/private/files/:splat"
  status = 200
  force = true

# Single-page app fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
